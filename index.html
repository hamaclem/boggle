<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Boggle</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#d9d9d9">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Boggle">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">

  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      overflow: hidden;
    }

    body {
      --timer-space: 110px;
      position: relative;
      box-sizing: border-box;
      min-height: 100dvh;
      padding: max(18px, env(safe-area-inset-top)) 16px max(18px, env(safe-area-inset-bottom));
      background: #d9d9d9;
      color: #111;
      font-family: Arial, sans-serif;
      overscroll-behavior: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
      display: flex;
      flex-direction: column;
    }

    #stage {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
    }

    #game {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      width: min(84vmin, 94vw, calc(100dvh - 2 * var(--timer-space)));
      height: auto;
      position: relative;
      pointer-events: auto;
    }

    #board {
      position: relative;
      width: 100%;
    }

    #timer {
      position: absolute;
      left: 0;
      right: 0;
      bottom: max(18px, env(safe-area-inset-bottom));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(3rem, 8vw, 4.5rem);
      font-weight: 700;
      line-height: 1;
      min-height: 88px;
    }

    #timerText {
      display: block;
    }

    #grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 2.5%;
      width: 100%;
      aspect-ratio: 1;
      opacity: 0;
      pointer-events: none;
    }

    #grid.active {
      opacity: 1;
      pointer-events: auto;
    }

    .box {
      display: grid;
      place-items: center;
      border: 2px solid #111;
      border-radius: 18px;
      background: #fff;
      color: #111;
      font-size: clamp(3rem, 9.2vmin, 5.2rem);
      font-weight: 700;
      text-transform: uppercase;
    }

    #start {
      width: fit-content;
      height: fit-content;
      border: 2px solid #111;
      border-radius: 18px;
      padding: 18px 34px;
      background: #fff;
      color: #111;
      font: inherit;
      font-size: clamp(2.2rem, 7vmin, 3.4rem);
      font-weight: 700;
      text-transform: uppercase;
      cursor: pointer;
      position: absolute;
      inset: 50% auto auto 50%;
      transform: translate(-50%, -50%);
      z-index: 1;
    }

    #start.hidden {
      display: none;
    }

    body.game-finished #start {
      display: inline-flex;
      padding: 14px 24px;
      font-size: clamp(1.8rem, 5.5vmin, 2.6rem);
      position: static;
      transform: none;
    }

    @media (max-width: 600px) {
      body {
        --timer-space: 92px;
        padding: max(14px, env(safe-area-inset-top)) 12px max(14px, env(safe-area-inset-bottom));
      }

      #game {
        width: min(88vmin, 94vw, calc(100dvh - 2 * var(--timer-space)));
      }

      #timer {
        bottom: max(14px, env(safe-area-inset-bottom));
        min-height: 76px;
      }

      body.game-finished #start {
        padding: 12px 20px;
        font-size: clamp(1.5rem, 5vmin, 2.2rem);
      }
    }
  </style>
</head>
  <body>
  <div id="stage">
    <div id="game">
      <div id="board">
        <div id="grid">
          <div class="box"></div>
          <div class="box"></div>
          <div class="box"></div>
          <div class="box"></div>
          <div class="box"></div>
          <div class="box"></div>
          <div class="box"></div>
          <div class="box"></div>
          <div class="box"></div>
          <div class="box"></div>
          <div class="box"></div>
          <div class="box"></div>
          <div class="box"></div>
          <div class="box"></div>
          <div class="box"></div>
          <div class="box"></div>
        </div>
        <button id="start" type="button">Boggle</button>
      </div>
    </div>
  </div>

  <div id="timer"><span id="timerText"></span></div>

  <script>
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js");

    const dice = [
      "lewriu", "bmjqao", "efihse", "lgnyue",
      "iasorm", "afxroi", "atirlb", "ginetv",
      "sotend", "apecdm", "dznvea", "enirhs",
      "eralsc", "itaeoa", "tukoen", "tesulp"
    ];

    const grid = document.getElementById("grid");
    const boxes = [...grid.children];
    const board = document.getElementById("board");
    const start = document.getElementById("start");
    const timer = document.getElementById("timer");
    const timerText = document.getElementById("timerText");
    let gameTimeout = 0;
    let countdownInterval = 0;
    let wakeLock = null;
    let gameState = "idle";

    const isDesktop = () => window.matchMedia("(hover: hover) and (pointer: fine)").matches;

    const enterFullscreen = async () => {
      if (!isDesktop()) return;

      const request =
        document.documentElement.requestFullscreen ||
        document.documentElement.webkitRequestFullscreen ||
        document.documentElement.msRequestFullscreen;

      if (!request) return;

      try {
        await request.call(document.documentElement);
      } catch (_) {}
    };

    const shuffle = (items) => {
      const copy = [...items];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    };

    const requestWakeLock = async () => {
      if (!("wakeLock" in navigator) || wakeLock) return;
      try {
        wakeLock = await navigator.wakeLock.request("screen");
        wakeLock.addEventListener("release", () => {
          wakeLock = null;
        });
      } catch (_) {}
    };

    const releaseWakeLock = async () => {
      if (!wakeLock) return;
      try {
        await wakeLock.release();
      } catch (_) {}
      wakeLock = null;
    };

    const rollDice = () => {
      shuffle(dice).forEach((die, index) => {
        boxes[index].textContent = die[Math.floor(Math.random() * die.length)].toUpperCase();
      });
    };

    const updateTimer = (seconds) => {
      const minutes = Math.floor(seconds / 60);
      const rest = seconds % 60;
      timerText.textContent = `${minutes}:${String(rest).padStart(2, "0")}`;
    };

    const finishGame = async () => {
      if (gameState !== "playing") return;

      clearTimeout(gameTimeout);
      clearInterval(countdownInterval);
      timerText.textContent = "";
      gameState = "finished";
      document.body.classList.remove("game-playing");
      document.body.classList.add("game-finished");
      timer.appendChild(start);
      start.classList.remove("hidden");
      start.textContent = "Boggle";
      await releaseWakeLock();
    };

    const startGame = async () => {
      if (gameState === "playing") return;
      gameState = "playing";
      let timeLeft = 180;

      board.appendChild(start);
      document.body.classList.remove("game-finished");
      document.body.classList.add("game-playing");
      start.classList.add("hidden");
      grid.classList.add("active");
      rollDice();
      updateTimer(timeLeft);
      await enterFullscreen();
      await requestWakeLock();
      clearInterval(countdownInterval);
      clearTimeout(gameTimeout);
      countdownInterval = window.setInterval(() => {
        timeLeft -= 1;
        if (timeLeft <= 0) {
          finishGame();
          return;
        }
        updateTimer(timeLeft);
      }, 1000);
      gameTimeout = window.setTimeout(() => {
        finishGame();
      }, 180000);
    };

    start.addEventListener("click", startGame);

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible" && grid.classList.contains("active")) {
        requestWakeLock();
      }
    });
  </script>
</body>
</html>
