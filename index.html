<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Boggle</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#d9d9d9">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Boggle">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">

  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      overflow: hidden;
    }

    body {
      display: grid;
      place-items: center;
      gap: 18px;
      box-sizing: border-box;
      min-height: 100dvh;
      padding: max(18px, env(safe-area-inset-top)) 16px max(18px, env(safe-area-inset-bottom));
      background: #d9d9d9;
      color: #111;
      font-family: Arial, sans-serif;
      overscroll-behavior: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
    }

    #game {
      position: relative;
      display: grid;
      place-items: center;
      width: min(84vmin, 94vw);
      height: min(84vmin, 94vw);
    }

    #grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 2.5%;
      width: 100%;
      height: 100%;
      opacity: 0;
      pointer-events: none;
    }

    #grid.active {
      opacity: 1;
      pointer-events: auto;
    }

    .box {
      display: grid;
      place-items: center;
      border: 2px solid #111;
      border-radius: 18px;
      background: #fff;
      color: #111;
      font-size: clamp(3rem, 9.2vmin, 5.2rem);
      font-weight: 700;
      text-transform: uppercase;
    }

    #start {
      position: absolute;
      border: 0;
      border-radius: 12px;
      padding: 18px 46px;
      background: #111;
      color: #fff;
      font: inherit;
      font-size: 34px;
      cursor: pointer;
    }

    #start.hidden {
      display: none;
    }

    #timer {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 88px;
      font-size: clamp(3rem, 8vw, 4.5rem);
      font-weight: 700;
      line-height: 1;
    }

    @media (max-width: 600px) {
      body {
        gap: 14px;
        padding: max(14px, env(safe-area-inset-top)) 12px max(14px, env(safe-area-inset-bottom));
      }

      #game {
        width: min(88vmin, 94vw);
        height: min(88vmin, 94vw);
      }

      #timer {
        min-height: 76px;
      }
    }
  </style>
</head>
<body>
  <div id="game">
    <div id="grid">
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
    </div>
    <button id="start" type="button">Boggle</button>
  </div>

  <div id="timer"></div>

  <script>
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js");

    const dice = [
      "lewriu", "bmjqao", "efihse", "lgnyue",
      "iasorm", "afxroi", "atirlb", "ginetv",
      "sotend", "apecdm", "dznvea", "enirhs",
      "eralsc", "itaeoa", "tukoen", "tesulp"
    ];

    const grid = document.getElementById("grid");
    const boxes = [...grid.children];
    const start = document.getElementById("start");
    const timer = document.getElementById("timer");
    let gameTimeout = 0;
    let countdownInterval = 0;
    let wakeLock = null;

    const shuffle = (items) => {
      const copy = [...items];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    };

    const requestWakeLock = async () => {
      if (!("wakeLock" in navigator) || wakeLock) return;
      try {
        wakeLock = await navigator.wakeLock.request("screen");
        wakeLock.addEventListener("release", () => {
          wakeLock = null;
        });
      } catch (_) {}
    };

    const releaseWakeLock = async () => {
      if (!wakeLock) return;
      try {
        await wakeLock.release();
      } catch (_) {}
      wakeLock = null;
    };

    const rollDice = () => {
      shuffle(dice).forEach((die, index) => {
        boxes[index].textContent = die[Math.floor(Math.random() * die.length)].toUpperCase();
      });
    };

    const updateTimer = (seconds) => {
      const minutes = Math.floor(seconds / 60);
      const rest = seconds % 60;
      timer.textContent = `${minutes}:${String(rest).padStart(2, "0")}`;
    };

    const resetGame = async () => {
      clearTimeout(gameTimeout);
      clearInterval(countdownInterval);
      start.classList.remove("hidden");
      grid.classList.remove("active");
      timer.textContent = "";
      await releaseWakeLock();
    };

    const startGame = async () => {
      let timeLeft = 180;

      start.classList.add("hidden");
      grid.classList.add("active");
      rollDice();
      updateTimer(timeLeft);
      await requestWakeLock();
      clearInterval(countdownInterval);
      clearTimeout(gameTimeout);
      countdownInterval = window.setInterval(() => {
        timeLeft -= 1;
        updateTimer(timeLeft);
        if (timeLeft <= 0) clearInterval(countdownInterval);
      }, 1000);
      gameTimeout = window.setTimeout(resetGame, 180000);
    };

    start.addEventListener("click", startGame);

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible" && grid.classList.contains("active")) {
        requestWakeLock();
      }
    });
  </script>
</body>
</html>
